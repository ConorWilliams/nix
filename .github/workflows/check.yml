# Runs on every push and pull request: main is what `curl | bash` installs,
# so a broken config or a leaked secret should never get there unnoticed.
# Each job runs a group of .github/check.sh, which runs them all locally.
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for the secret scan
      - uses: cachix/install-nix-action@v31
      # Flake check and formatting.
      - run: .github/check.sh check
      # No secrets anywhere in the history.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Linters, strict settings included.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: .github/check.sh lint

  # The Zellij plugins: clippy and tests.
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target # the crates share their dependencies
      CARGO_INCREMENTAL: 0 # no use from scratch; it would only grow the cache
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Compiled dependencies, rebuilt when the toolchain (flake.lock) or a
      # Cargo.lock changes; otherwise only the crates themselves compile.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('flake.lock', 'home/zellij/*/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: .github/check.sh rust

  # Neovim starts without errors and lua_ls finds no problems.
  nvim:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # to purge superseded Nix store caches
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # The Nix store: the home files' builds (the WASI plugins above all)
      # took minutes. Only the newest store is kept (GitHub allows 10 GB).
      # Its garbage collection keeps what check.sh roots in CHECK_GC_ROOTS.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-nvim-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix', 'home/zellij/**', '.github/check.sh') }}
          restore-prefixes-first-match: nix-nvim-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-nvim-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - run: .github/check.sh nvim
        env:
          CHECK_GC_ROOTS: ${{ runner.temp }}/gcroots

  # A fresh install: bootstrap.sh run as the server user (conix) on a clean
  # machine, with no terminal, so it declines every prompt (logins included).
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # to purge superseded Nix store caches
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Its own Nix store cache; the user's Home Manager profile roots what
      # the bootstrap built, so the garbage collection keeps it.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-bootstrap-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix', 'home/zellij/**', 'bootstrap.sh') }}
          restore-prefixes-first-match: nix-bootstrap-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-bootstrap-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      # The user, with this checkout where the bootstrap keeps the repo.
      - run: |
          sudo useradd --create-home --shell /bin/bash conix
          sudo cp -a . /home/conix/nix
          sudo chown -R conix: /home/conix/nix
      # A clean environment, as a login's (the runner's XDG_* got through).
      - run: >-
          sudo -u conix env -i HOME=/home/conix USER=conix LOGNAME=conix
          PATH="/nix/var/nix/profiles/default/bin:/usr/local/bin:/usr/bin:/bin"
          bash /home/conix/nix/bootstrap.sh </dev/null
      # Home Manager switched: its profile, fish, and the dotfiles linked.
      - run: |
          sudo -u conix -H bash -euc '
            test -L ~/.local/state/nix/profiles/home-manager
            ~/.nix-profile/bin/fish --version
            readlink ~/.config/fish/config.fish | grep -q "^/nix/store/"
            readlink ~/.config/nvim
          '
